name: Bug report
description: The pack does not install, does not appear or breaks the interface
title: '[Bug]: '
labels: ['bug']
body:
  - type: input
    id: orca_version
    attributes:
      label: Orca version
      placeholder: 1.4.245
    validations:
      required: true
  - type: input
    id: pack_version
    attributes:
      label: Pack version
      placeholder: 1.3.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 26.1
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What happened
      description: Steps to reproduce and any error text.
    validations:
      required: true
