name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0
      - name: Check the tag matches the version
        run: |
          version=$(node -p 'require(process.cwd() + "/orca-plugin.json").version')
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version" >&2
            exit 1
          fi
      - name: Check the catalog
        run: |
          node tools/check-pack.mjs
          node tools/check-review.mjs
      - name: Build the plugin archive
        run: |
          name="orca-vietnamese-${GITHUB_REF_NAME#v}"
          mkdir -p "dist/$name/locales"
          cp orca-plugin.json README.md LICENSE THIRD_PARTY_NOTICES.md "dist/$name/"
          cp locales/vi.json "dist/$name/locales/"
          (cd dist && zip -qr "$name.zip" "$name")
      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            index($0, "## [" version "]") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --notes-file release-notes.md
