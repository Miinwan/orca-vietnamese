name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0
      - name: Build the catalog
        run: |
          python3 tools/merge-drafts.py
          node tools/build-pack.mjs
          python3 tools/unify-terms.py
          node tools/build-pack.mjs
      - name: Check the catalog
        run: |
          node tools/check-pack.mjs
          node tools/check-review.mjs
          python3 tools/check-consistency.py
      - name: Check the committed catalog matches the build
        run: git diff --exit-code -- locales/vi.json tools/review sources
