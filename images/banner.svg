<svg xmlns='http://www.w3.org/2000/svg' width='1280' height='400' viewBox='0 0 1280 400' role='img' aria-label='Tiếng Việt cho Orca: Vietnamese language pack for Orca'>
  <defs>
    <linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0' stop-color='#0c1018'/>
      <stop offset='0.6' stop-color='#141924'/>
      <stop offset='1' stop-color='#1d1216'/>
    </linearGradient>
    <radialGradient id='glow' cx='0.82' cy='0.5' r='0.55'>
      <stop offset='0' stop-color='#da251d' stop-opacity='0.3'/>
      <stop offset='1' stop-color='#da251d' stop-opacity='0'/>
    </radialGradient>
    <linearGradient id='rule' x1='0' y1='0' x2='1' y2='0'>
      <stop offset='0' stop-color='#da251d'/>
      <stop offset='1' stop-color='#ffcd00'/>
    </linearGradient>
  </defs>
  <rect width='1280' height='400' fill='url(#bg)'/>
  <rect width='1280' height='400' fill='url(#glow)'/>
  <g font-family='Inter, -apple-system, Segoe UI, Helvetica Neue, Arial, sans-serif'>
    <text x='72' y='126' fill='#ffcd00' font-size='17' font-weight='600' letter-spacing='3'>LANGUAGE PACK FOR ORCA</text>
    <text x='70' y='192' fill='#ffffff' font-size='56' font-weight='700'>Tiếng Việt cho Orca</text>
    <rect x='72' y='216' width='88' height='4' rx='2' fill='url(#rule)'/>
    <text x='72' y='262' fill='#c6ccd8' font-size='23'>The Orca interface in natural Vietnamese.</text>
    <text x='72' y='296' fill='#8a93a6' font-size='19'>Data only: no code, no account or agent changes.</text>
    <g transform='translate(730 62)'>
      <rect width='478' height='276' rx='14' fill='#10141d' stroke='#2b3242'/>
      <circle cx='24' cy='23' r='6' fill='#ff5f57'/>
      <circle cx='44' cy='23' r='6' fill='#febc2e'/>
      <circle cx='64' cy='23' r='6' fill='#28c840'/>
      <text x='239' y='28' fill='#8a93a6' font-size='14' text-anchor='middle'>Cài đặt</text>
      <path d='M0 46 H478 M150 46 V276' stroke='#2b3242'/>
      <g font-size='15' fill='#aab2c2'>
        <text x='24' y='84'>Chung</text>
        <rect x='12' y='100' width='126' height='34' rx='8' fill='#232a39'/>
        <text x='24' y='122' fill='#ffffff' font-weight='600'>Giao diện</text>
        <text x='24' y='160'>Agent</text>
        <text x='24' y='198'>Tiện ích</text>
        <text x='24' y='236'>Tài khoản</text>
      </g>
      <text x='176' y='84' fill='#ffffff' font-size='18' font-weight='600'>Ngôn ngữ</text>
      <text x='176' y='108' fill='#8a93a6' font-size='13'>Ngôn ngữ của giao diện Orca</text>
      <rect x='176' y='126' width='276' height='44' rx='9' fill='#171c27' stroke='#2b3242'/>
      <text x='194' y='154' fill='#aab2c2' font-size='15'>English</text>
      <rect x='176' y='180' width='276' height='44' rx='9' fill='#2a1a1c' stroke='#da251d'/>
      <text x='194' y='208' fill='#ffffff' font-size='15' font-weight='600'>Tiếng Việt</text>
      <path d='M424 202 l6 6 l11 -13' fill='none' stroke='#ffcd00' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/>
    </g>
  </g>
</svg>
